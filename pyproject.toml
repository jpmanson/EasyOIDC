[project]
name = "EasyOIDC"
version = "0.4.0"
description = "Easy integration with OIDC authentication servers"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Juan Pablo Manson", email = "jpmanson@gmail.com"}
]
keywords = ["oidc", "oauth", "authentication", "openid-connect"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "authlib>=1.3.0",
    "requests>=2.31.0",
    "python-decouple>=3.8",
    "joserfc>=1.0.0",
]

[project.optional-dependencies]
# Redis session storage (optional). Uses redis-py directly, with no version
# cap. Kept out of the core dependencies so users of the 'memory' or 'shelve'
# modes are not forced to install Redis.
redis = ["redis>=4.0.0"]
flask = ["flask>=2.3.3"]
# itsdangerous is required by Starlette's SessionMiddleware, which signs the
# session cookie; uvicorn is the ASGI server used to run the examples.
fastapi = ["fastapi>=0.100.0", "itsdangerous>=2.0.0", "uvicorn>=0.23.0"]
nicegui = ["nicegui>=1.4.0", "fastapi"]
taipy = ["taipy>=2.4.0"]
# httpx is required by Starlette's TestClient, used by the FastAPI tests.
dev = ["pytest", "ruff", "httpx>=0.23.0"]

[project.urls]
Homepage = "https://github.com/jpmanson/EasyOIDC"
Repository = "https://github.com/jpmanson/EasyOIDC"
Issues = "https://github.com/jpmanson/EasyOIDC/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["EasyOIDC"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "httpx>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
