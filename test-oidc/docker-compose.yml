services:
  oidc:
    # Lightweight, zero-config test OIDC server.
    # Exposes discovery at http://localhost:8080/default/.well-known/openid-configuration
    # and an interactive login page where you can type any user.
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8080:8080"
    environment:
      # Listen on all interfaces inside the container
      SERVER_PORT: "8080"
