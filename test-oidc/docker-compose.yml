services:
  oidc:
    # Servidor OIDC de prueba, liviano y sin configuración.
    # Expone discovery en http://localhost:8080/default/.well-known/openid-configuration
    # y una página de login interactiva donde podés escribir cualquier usuario.
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8080:8080"
    environment:
      # Escucha en todas las interfaces del contenedor
      SERVER_PORT: "8080"
